  description: |
    Python backend developer with 3+ years of commercial experience. I specialize in Django/DRF and FastAPI, work with high-load systems, optimize queries and set up CI/CD.
    On the side, I build full-cycle commercial websites – from architecture to deployment – with Nuxt and FastAPI.
experience:
  title: Work experience
  items:
    - position: 'Python Developer'
      date: '09.2025 – Present'
      summary: 'High-load services for transport-security systems: multi-terabyte MongoDB, heavy parallel data processing, and sensitive data under NDA.'
      details:
        - 'Designed and shipped an aggregating collection over a multi-terabyte MongoDB store, consolidated dozens of disparate collections into a single model, cut time to retrieve a full record summary from 3–5s to <100ms and reduced database load by ~40%.'
        - 'Built from scratch a Git-style state-versioning system (change commits, state diffs, stable versions and a history graph), made regressions between releases traceable and halved acceptance-testing time.'
        - 'Stabilized and extended a high-load parallel data-processing system (threading, multiprocessing) and ensured correct service behavior under peak load.'
        - 'Introduced centralized error monitoring (Sentry) and uptime alerting to Telegram across my services, cut mean time to detect (MTTD) from hours to minutes and eliminated silent failures.'
        - 'Rewrote legacy services on async FastAPI, reduced p95 latency from ~500ms to 80ms and increased throughput 1.5–2x.'
        - 'Applied information-security practices in services handling sensitive data under NDA: input validation, access control and dependency review.'
      stack: ['Python', 'FastAPI', 'MongoDB', 'Redis', 'Docker', 'Sentry']
      company:
        name: Innovation Center «Safe Transport»
        logo: '/logos/ict.png'
        url: 'https://ictransport.ru/'
        color: '#7c3aed'
    - position: 'Python Developer'
      date: '09.2024 – 08.2025'
      summary: 'Django (DRF) monolith plus aiohttp and FastAPI microservices; team of 15 engineers, full ownership of my services.'
      details:
        - 'Optimized 10+ high-load API endpoints using Prometheus and Grafana data: reworked ORM queries (select_related/prefetch, indexes), added Redis caching and rate limiting and cut p95 latency from ~1s to <100ms at ~100 RPS per instance.'
        - 'Rewrote 10+ minute SQL queries using Django CTEs and window functions, cut their execution time to seconds and removed critical load from the database.'
        - 'Moved 200+ tests to pytest with parallelized CI runs, raised coverage from below 50% and sped up the pipeline.'
        - 'Migrated API docs to OpenAPI 3.0, replaced django-rest-swagger with drf-spectacular, documented 150+ endpoints and delivered clear API contracts to neighboring teams.'
        - 'Ran a security audit of the services, closed SQL injections and replaced insecure libraries.'
        - 'Unified Dockerfiles for two services, adopted the uv package manager and sped up image builds.'
      stack:
        ['Python', 'Django', 'DRF', 'aiohttp', 'FastAPI', 'PostgreSQL', 'Redis', 'Prometheus', 'Grafana', 'Docker', 'pytest']
      company:
        name: RUTUBE
        logo: '/logos/rutube.png'
        url: 'https://rutube.ru'
        color: '#e62117'
    - position: 'Python Developer'
      date: '05.2023 – 08.2024'
      summary: 'Backend development of corporate web services on Python/Django with PostgreSQL: server-side logic, integrations, and production infrastructure.'
      details:
        - 'Built and shipped the backend of 4 corporate web projects on Python/Django (DRF) with PostgreSQL: domain models, business logic, catalogs, and admin panels.'
        - 'Implemented server-side handling of client requests with validation, PostgreSQL storage and instant notifications and cut business response time from hours to 1–2 minutes.'
        - 'Integrated payment systems, web analytics and email delivery via APIs and ensured reliable payment handling.'
        - 'Optimized service performance: added caching, reworked SQL queries and indexes and sped up page response.'
        - 'Set up production infrastructure and deployment (hosting, domains, SSL/HTTPS) and kept services running reliably in production.'
      stack: ['Python', 'Django', 'DRF', 'PostgreSQL', 'Nginx', 'Docker']
      company:
        name: PSK SOFT LLC
        logo: '/logos/psk.png'
        url: 'https://www.psknpomash.ru/'

faq:
  title: Frequently asked questions
  description: A bit about how I work, what I think about technology, and how to work with me.
  categories:
    - title: Approach to work
      questions:
        - label: What does "good code" mean to you?
          content: |
            Code that another person — or myself — can understand painlessly six months later. To me, readability beats cleverness, explicit beats implicit, and tests are part of the job, not a "later." At RUTUBE I migrated more than 200 tests to pytest with parallelized runs in CI, so the pipeline wouldn't turn into a bottleneck. And documentation: I updated and documented 150+ endpoints in OpenAPI 3.0, because an API without clear docs is an API that's awkward for neighboring teams to use.
        - label: Does your information security background help you?
          content: |
            Yes, and it's one of the things that sets me apart as a backend developer. I'm studying Information Security at MEPHI, and it shapes how I write code: I think about injections, insecure dependencies and validation at the design stage, not once an incident has already hit. At RUTUBE I closed real vulnerabilities — from SQL injections to insecure libraries. Security isn't a separate checkbox for me, it's part of doing development properly.
        - label: Do you use AI in your development work?
          content: |
            Actively — as a tool, not a replacement for thinking. AI is great at speeding up routine work: boilerplate, tests, making sense of unfamiliar code, first drafts of documentation. But architectural decisions, reviews and responsibility for the outcome stay with me. I keep up with the evolution of AI tooling and know how to fit it into a workflow so it actually saves time rather than piling up technical debt.
    - title: Technology
      questions:
        - label: Django or FastAPI — which do you choose?
          content: |
            It depends on the task. I reach for Django/DRF when I need a fast start with an admin panel, an ORM and a ready-made ecosystem — for example, products with a lot of CRUD and business logic. FastAPI — when async, speed and lightweight microservices with a clear API contract matter. At RUTUBE, by the way, both coexisted: a Django monolith and microservices on aiohttp/FastAPI. You pick the tool for the task, not the other way around.
        - label: You're a backend developer, but you also do frontend. How come?
          content: |
            My main specialization is backend, and that's where I want to grow. But I can cover the full cycle: I built several commercial projects (vendorfind.ru, ters.gallery and others) entirely on my own — the architecture, the backend on FastAPI/Django, the frontend on Nuxt, and deployment. For a business that's convenient: one person instead of three. For me it's an understanding of how the whole system works, not just my half of it.
        - label: Do you have experience with high-load systems?
          content: |
            Yes. At RUTUBE — optimizing heavily loaded API endpoints, caching, queues on RabbitMQ and Kafka, background tasks on Celery. At the Innovation Center «Safe Transport» I work with systems holding terabytes of data in MongoDB: here it's essential to think about indexes, volumes and the cost of every query. Infrastructure-wise — Docker, Kubernetes, Nginx, CI/CD on GitHub Actions and GitLab CI.
    - title: Collaboration
      questions:
        - label: Are you open to job offers?
          content: |
            Yes, I'm considering interesting backend positions — especially where there are challenging problems, high load and room to grow. I'm looking for fully remote work worldwide. Reach out on Telegram [@haku4130](https://t.me/haku4130) or by email at a.osipov.code@gmail.com — my resume is [on hh.ru](https://hh.ru/resume/c7218ed5ff0f69ec950039ed1f4a7233554461).
        - label: Do you take on website development projects?
          content: |
            Yes. I build turnkey commercial websites and web applications — from architecture design to deployment and support. Stack: Nuxt (Vue) on the frontend, FastAPI/Django + PostgreSQL on the backend, all in Docker. I can take a project on end to end or join an existing team on the backend.
        - label: How can I get in touch with you?
          content: |
            The easiest way is Telegram: [@haku4130](https://t.me/haku4130). You can also email me at a.osipov.code@gmail.com. I usually reply within the day.

title: Обо мне
description: Python backend разработчик из Москвы. Здесь немного о моём пути, подходе к работе и образовании.
content: |
  Привет, я Андрей Осипов — Python backend разработчик из Москвы.

  Программирую с 2021 года. За это время поработал в RUTUBE, ИЦ «Безопасный транспорт» и ПСК НПО Машиностроения, а также реализовал несколько коммерческих fullstack-проектов самостоятельно.

  ### Чем занимаюсь

  Основная специализация — **Python backend**: Django/DRF, FastAPI, PostgreSQL, Redis, Celery, Docker. Умею работать с высоконагруженными системами: оптимизировать ORM-запросы, внедрять кеширование, настраивать мониторинг через Prometheus/Grafana, выстраивать CI/CD.

  На фронтенде работаю с **Nuxt (Vue)** — этого хватает, чтобы разрабатывать коммерческие сайты полностью самостоятельно, от архитектуры до деплоя.

  ### Образование

  Учусь в **НИЯУ МИФИ** на направлении «Информационная безопасность» (магистратура, 2025–2027). Бакалавриат там же закончил в 2025 году. Также прошёл обучение в **Школе 21 от Сбера** (2023).

  Безопасность — не просто специальность, но и личный интерес: слежу за индустрией, понимаю угрозы на уровне кода.

  ### Вне работы

  Интересуюсь новыми технологиями в экосистеме Python и JavaScript. Участвую в open source. Иногда разбираю интересные CVE.

  Если хочешь обсудить проект или просто пообщаться — пиши в [Telegram](https://t.me/haku4130) или на [почту](mailto:a.osipov.code@gmail.com).

about:
  title: 'О себе'
  description: |
    Python backend разработчик с 3+ годами коммерческого опыта. Специализируюсь на Django/DRF и FastAPI, работаю с высоконагруженными системами, оптимизирую запросы и выстраиваю CI/CD.
    Параллельно делаю коммерческие сайты полного цикла – от архитектуры до деплоя – на Nuxt и FastAPI.

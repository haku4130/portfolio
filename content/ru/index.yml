testimonials:
  - quote: 'Андрей за год вырос в одного из самых надёжных разработчиков в команде. Взял на себя оптимизацию нагруженных эндпоинтов — разобрался глубоко, внедрил кеширование, Rate Limiting, поправил ORM-запросы. Время отклика на ключевых ручках упало до стабильных 100 мс. Параллельно навёл порядок в документации API — задокументировал 150+ эндпоинтов, перевёл всё на OpenAPI 3.0. Go и фронтенд-команды сразу почувствовали разницу. Рекомендую без оговорок.'
    author:
      name: 'Михаил Корсаков'
      description: 'Техлид серверной разработки, RUTUBE'
      avatar:
        src: 'https://ui-avatars.com/api/?name=МК&size=80&background=1e1b4b&color=a5b4fc'
  - quote: 'Обращался к Андрею за разработкой интернет-магазина мебели ters.gallery. Он взял на себя всё: от архитектуры и бэкенда до фронтенда и деплоя. Не нужно было искать отдельно дизайнера, бэкендера и верстальщика — Андрей закрыл всё сам, быстро и без лишних вопросов. Сайт работает стабильно и приносит прибыль, без единой жалобы. Буду обращаться ещё.'
    author:
      name: 'Арутюн Согомонян'
      description: "Основатель, Ter's"
      avatar:
        src: 'https://ui-avatars.com/api/?name=АС&size=80&background=7c2d12&color=fed7aa'
  - quote: 'Андрей построил Vendor Hub с нуля — в одиночку спроектировал архитектуру, написал бэкенд и фронтенд, довёл платформу до продакшена. Для стартапа это критично: не нужно было собирать команду и тратить месяцы на найм, чтобы просто проверить гипотезу. При этом качество кода и подход к делу на уровне куда более крупных команд. Андрей не просто кодит по ТЗ — предлагает решения и думает наперёд.'
    author:
      name: 'Донат Шишмарёв'
      description: 'Основатель, Vendor Hub'
      avatar:
        src: 'https://ui-avatars.com/api/?name=ДШ&size=80&background=065f46&color=6ee7b7'
faq:
  title: Часто задаваемые вопросы
  description: Немного о том, как я работаю, что думаю о технологиях и как со мной сотрудничать.
  categories:
    - title: Подход к работе
      questions:
        - label: Что для тебя «хороший код»?
          content: |
            Тот, который через полгода без боли поймёт другой человек — или я сам. Для меня это читаемость важнее хитрости, явное лучше неявного, а тесты — часть работы, а не «потом». В RUTUBE я перевёл больше 200 тестов на pytest с распараллеленным запуском в CI, чтобы пайплайн не превращался в бутылочное горлышко. И документация: обновил и задокументировал 150+ эндпоинтов на OpenAPI 3.0, потому что API без внятной документации — это API, которым неудобно пользоваться соседним командам.
        - label: Помогает ли тебе бэкграунд в информационной безопасности?
          content: |
            Да, и это одно из моих отличий как бэкендера. Я учусь на «Информационной безопасности» в МИФИ, и это влияет на то, как я пишу код: думаю об инъекциях, небезопасных зависимостях и валидации ещё на этапе проектирования, а не когда уже прилетел инцидент. В RUTUBE закрывал реальные уязвимости — от SQL-инъекций до небезопасных библиотек. Безопасность для меня не отдельная галочка, а часть нормальной разработки.
        - label: Используешь ли ты AI в разработке?
          content: |
            Активно — как инструмент, а не как замену мышлению. AI отлично ускоряет рутину: бойлерплейт, тесты, разбор незнакомого кода, черновики документации. Но архитектурные решения, ревью и ответственность за результат остаются на мне. Я слежу за развитием AI-инструментов и умею встраивать их в рабочий процесс так, чтобы они реально экономили время, а не создавали технический долг.
    - title: Технологии
      questions:
        - label: Django или FastAPI — что выбираешь?
          content: |
            Зависит от задачи. Django/DRF беру, когда нужен быстрый старт с админкой, ORM и готовой экосистемой — например, для продуктов с большим количеством CRUD и бизнес-логики. FastAPI — когда важны асинхронность, скорость и лёгкие микросервисы с чётким контрактом API. В RUTUBE, кстати, сосуществовало и то, и другое: монолит на Django и микросервисы на aiohttp/FastAPI. Инструмент выбирается под задачу, а не наоборот.
        - label: Ты backend-разработчик, но делаешь и фронтенд. Как так?
          content: |
            Основная специализация — backend, и именно там я хочу расти. Но я умею закрывать полный цикл: несколько коммерческих проектов (vendorfind.ru, ters.gallery и другие) сделал полностью сам — архитектуру, бэкенд на FastAPI/Django, фронтенд на Nuxt и деплой. Для бизнеса это удобно: один человек вместо трёх. Для меня — понимание, как система работает целиком, а не только своя её половина.
        - label: Есть ли опыт с высоконагруженными системами?
          content: |
            Да. В RUTUBE — оптимизация нагруженных API-ручек, кеширование, очереди на RabbitMQ и Kafka, фоновые задачи на Celery. В ИЦ «Безопасный транспорт» работаю с системами, где данных на терабайты в MongoDB: тут уже важно думать про индексы, объёмы и стоимость каждого запроса. Инфраструктурно — Docker, Kubernetes, Nginx, CI/CD на GitHub Actions и GitLab CI.
    - title: Сотрудничество
      questions:
        - label: Открыт ли ты к предложениям о работе?
          content: |
            Да, рассматриваю интересные backend-позиции — особенно там, где есть сложные задачи, высокая нагрузка и возможность расти. Ищу удаленку по миру. Пишите в Telegram [@haku4130](https://t.me/haku4130) или на почту a.osipov.code@gmail.com — резюме есть [на hh.ru](https://hh.ru/resume/c7218ed5ff0f69ec950039ed1f4a7233554461).
        - label: Берёшься ли за разработку сайтов на заказ?
          content: |
            Да. Делаю коммерческие сайты и веб-приложения под ключ — от проектирования архитектуры до деплоя и поддержки. Стек: Nuxt (Vue) на фронте, FastAPI/Django + PostgreSQL на бэке, всё в Docker. Могу взять проект целиком или подключиться к существующей команде на бэкенд.
        - label: Как с тобой связаться?
          content: |
            Проще всего — Telegram: [@haku4130](https://t.me/haku4130). Также можно на почту: a.osipov.code@gmail.com. Обычно отвечаю в течение дня.

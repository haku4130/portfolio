title: VendorHub – B2B-маркетплейс для вендоров
description: 'B2B-платформа подбора вендоров под проекты компаний. Отвечал за серверную часть: архитектура БД, REST API на FastAPI, движок многофакторного подбора и ранжирования вендоров, вывод в продакшен. Сервис объединяет вендоров и покупателей: каталог с фильтрацией, профили и система заявок.'
